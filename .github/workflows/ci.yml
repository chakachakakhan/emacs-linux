name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Build application
        run: |
          mkdir -p dist/hello-app/bin

          cat > dist/hello-app/bin/hello-app <<'EOF'
          #!/usr/bin/env bash
          echo "Hello from the emacs-linux build pipeline!"
          echo "Architecture: $(uname -m)"
          EOF

          chmod +x dist/hello-app/bin/hello-app

      - name: Package application
        run: |
          tar -czf hello-app-linux.tar.gz -C dist hello-app

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: hello-app-linux
          path: hello-app-linux.tar.gz

  test:
    needs: build

    strategy:
      matrix:
        environment:
          - standard
          - alternate

    runs-on: ubuntu-24.04

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v5
        with:
          name: hello-app-linux

      - name: Show environment
        run: |
          echo "Testing environment: ${{ matrix.environment }}"

      - name: Test packaged application
        run: |
          mkdir -p test
          tar -xzf hello-app-linux.tar.gz -C test

          output="$(./test/hello-app/bin/hello-app)"

          echo "$output"

          echo "$output" | grep -q "Hello from the emacs-linux build pipeline!"