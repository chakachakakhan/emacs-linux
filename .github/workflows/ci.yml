name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Cache APT package lists
        uses: actions/cache@v4
        with:
          path: /var/lib/apt/lists
          key: apt-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            apt-${{ runner.os }}-${{ runner.arch }}-

      - name: Install compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc

      - name: Compile application
        run: |
          mkdir -p dist/hello-app/bin
          gcc hello.c -o dist/hello-app/bin/hello-app

      - name: Inspect binary
        run: |
          file dist/hello-app/bin/hello-app
          ldd dist/hello-app/bin/hello-app

      - name: Package application
        run: |
          tar -czf hello-app-linux.tar.gz -C dist hello-app

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: hello-app-linux
          path: hello-app-linux.tar.gz

  test-ubuntu:
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v5
        with:
          name: hello-app-linux

      - name: Show operating system
        run: |
          echo "Testing on Ubuntu 24.04"
          cat /etc/os-release

      - name: Test packaged application
        run: |
          mkdir -p test
          tar -xzf hello-app-linux.tar.gz -C test

          output="$(./test/hello-app/bin/hello-app)"

          echo "$output"

          echo "$output" | grep -q "Hello from the emacs-linux build pipeline!"

  test-arch:
    needs: build
    runs-on: ubuntu-24.04

    container:
      image: archlinux:latest

    steps:
      - name: Install test dependencies
        run: |
          pacman -Sy --noconfirm tar

      - name: Download build artifact
        uses: actions/download-artifact@v5
        with:
          name: hello-app-linux

      - name: Show operating system
        run: |
          echo "Testing on Arch Linux"
          cat /etc/os-release

      - name: Test packaged application
        run: |
          mkdir -p test
          tar -xzf hello-app-linux.tar.gz -C test

          output="$(./test/hello-app/bin/hello-app)"

          echo "$output"

          echo "$output" | grep -q "Hello from the emacs-linux build pipeline!"