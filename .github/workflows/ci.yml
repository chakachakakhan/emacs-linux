name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Build application
        run: |
          mkdir -p dist/hello-app/bin

          cat > dist/hello-app/bin/hello-app <<'EOF'
          #!/usr/bin/env bash
          echo "Hello from the emacs-linux build pipeline!"
          echo "Architecture: $(uname -m)"
          EOF

          chmod +x dist/hello-app/bin/hello-app

      - name: Package application
        run: |
          tar -czf hello-app-linux.tar.gz -C dist hello-app

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: hello-app-linux
          path: hello-app-linux.tar.gz

  test-ubuntu:
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v5
        with:
          name: hello-app-linux

      - name: Show operating system
        run: |
          echo "Testing on Ubuntu 24.04"
          cat /etc/os-release

      - name: Test packaged application
        run: |
          mkdir -p test
          tar -xzf hello-app-linux.tar.gz -C test

          output="$(./test/hello-app/bin/hello-app)"

          echo "$output"

          echo "$output" | grep -q "Hello from the emacs-linux build pipeline!"

  test-arch:
    needs: build
    runs-on: ubuntu-24.04

    container:
      image: archlinux:latest

    steps:
      - name: Install test dependencies
        run: |
          pacman -Sy --noconfirm tar

      - name: Download build artifact
        uses: actions/download-artifact@v5
        with:
          name: hello-app-linux

      - name: Show operating system
        run: |
          echo "Testing on Arch Linux"
          cat /etc/os-release

      - name: Test packaged application
        run: |
          mkdir -p test
          tar -xzf hello-app-linux.tar.gz -C test

          output="$(./test/hello-app/bin/hello-app)"

          echo "$output"

          echo "$output" | grep -q "Hello from the emacs-linux build pipeline!"