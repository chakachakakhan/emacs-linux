name: CI

on:
  push:
  pull_request:

jobs:
  hello:
    runs-on: ubuntu-24.04

    steps:
      - name: Inspect runner
        run: |
          echo "=== OS ==="
          cat /etc/os-release

          echo
          echo "=== Kernel ==="
          uname -a

          echo
          echo "=== Architecture ==="
          uname -m

          echo
          echo "=== CPU ==="
          nproc

          echo
          echo "=== Memory ==="
          free -h
